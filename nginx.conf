server {
    listen 80;
    client_max_body_size 10M;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options           "DENY"                             always;
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;
    # CSP: allows Google Maps, PayHere sandbox, Google Fonts, and self
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://sandbox.payhere.lk https://www.payhere.lk https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://maps.googleapis.com https://sandbox.payhere.lk https://generativelanguage.googleapis.com; frame-src https://sandbox.payhere.lk https://www.payhere.lk https://accounts.google.com;" always;

    # ── Backend API ──────────────────────────────────────────────────────────
    # All /api/* and /users/* routes are proxied to FastAPI
    location ~ ^/(api|users|products|categories|orders|cart|feedback|chat|ml|recommend|payment|suppliers|inventory|pictures|payment-slips|docs|openapi.json)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── WebSocket support ─────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ── Frontend React SPA ───────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support Vite HMR websocket during development
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
