services:
  db:
    image: postgres:15-alpine
    container_name: grocery_postgres_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grocery_fastapi_backend
    volumes:
      - pictures_data:/app/pictures
      - payment_slips_data:/app/payment_slips
      - ./data:/data
      - ./model_accuracy:/model_accuracy
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "sleep 10 && ./entrypoint.sh"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grocery_react_frontend
    command: npm run preview -- --host 0.0.0.0 --port 3000
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend

  metabase:
    image: metabase/metabase:v0.52.3
    container_name: grocery_metabase
    restart: on-failure
    ports:
      - "4000:3000"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - db
    env_file:
      - .env
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: db
      JAVA_OPTS: "-Xmx512m"

  proxy:
    image: nginx:alpine
    container_name: grocery_nginx_proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  metabase_data:
  pictures_data:
  payment_slips_data: